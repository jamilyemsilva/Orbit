<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sing-in</title>
</head>
<body>
  <main id="conteudo">

    <section class="login" id="login">
      <h1>Área de Login</h1>
      <div class="formulario">
        <form method="post">
          <h2>Informe seus dados</h2>
          <div class="campo">
            <label for="user-email">Username ou e-mail:</label>
            <input type="text" id="user-email" name="user-email" required>
          </div>
          <div class="campo">
            <label for="password">Senha:</label>
            <input type="text" id="password" name="password" required>
          </div>
          <button type="submit">Entrar</button>
        </form>
        <p><a href="#cadastro">Não possuo Cadastro</a></p>
      </div>
    </section>

    <section class="cadastro" id="cadastro">
      <h1>Área de Cadastro</h1>
      <div class="formulario">
        <form method="post">
          <h2>Informe seus dados</h2>
          <div class="campo">
            <label for="user">Username:</label>
            <input type="text" id="user" name="user" required>
          </div>
          <div class="campo">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required> 
          </div>
          <div class="campo">
            <label for="password-n">Senha:</label>
            <input type="text" id="password-n" name="password" required>
          </div>
          <button type="submit">Cadastrar-se</button>
        </form>
          <p><a href="#login">Já possuo conta</a></p>
      </div>
    </section>
  </main>
</body>
</html>
