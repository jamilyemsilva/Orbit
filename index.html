<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sing-in</title>
</head>
<body>
  <main>
    <section class="login" id="login">
      <h1>Área de Login</h1>
      <section class="formulario">
        <form action="" method="post">
          <h2>Informe seus dados</h2>
          <p>
            <label for="user-email">Username ou Email:</label>
            <input type="text" id="user-email" name="user-email" required>
          </p>
          <p>
            <label for="password">Senha:</label>
            <input type="text" id="password" name="password" required>
          </p>
          <p>
            <a href="home.html" class="button">Entrar</a>
          </p>
          <p>
            <a href="#cadastro">Não possuo cadastro</a>
          </p>
        </form>
      </section>
    </section>

    <section class="cadastro" id="cadastro">
      <h1>Área de Cadastro</h1>
      <section class="formulario">
        <form action="" method="post">
          <h2>Informe seus dados</h2>
          <p>
            <label for="user">Username:</label>
            <input type="text" id="user" name="user" required>
          </p>
          <p>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
          </p>
          <p>
            <label for="password-n">Senha:</label>
            <input type="text" id="password-n" name="password" required>
          </p>
          <p>
            <a href="home.html" class="button">Cadastrar-se</a>
          </p>
          <p>
            <a href="#login">Já possuo conta</a>
          </p>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
